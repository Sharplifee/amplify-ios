name: Scribbly
options:
  bundleIdPrefix: com.connor
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: XF783932R2
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Scribbly:
    type: application
    platform: iOS
    sources:
      - Scribbly
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.amplify
        INFOPLIST_FILE: Scribbly/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Scribbly/Scribbly.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: "Amplify CI"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: ScribblyControls
      - target: ScribblyWatch
    # Embeds the extension and the watch app automatically because of the dependencies.

  ScribblyControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"   # CarPlay / Watch Live Activity layout needs iOS 18
    sources:
      - ScribblyControls
      - Shared
      - SinkyShared
      - Scribbly/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.amplify.ScribblyControls
        INFOPLIST_FILE: ScribblyControls/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: "AmplifyControls CI"
        SKIP_INSTALL: YES

  ScribblyWatch:
    type: application
    platform: watchOS
    sources:
      - ScribblyWatch
      - SinkyShared
      - Scribbly/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.amplify.watchkitapp
        INFOPLIST_FILE: ScribblyWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: "AmplifyWatch CI"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ScribblyWatchWidgets

  ScribblyWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - ScribblyWatchWidgets
      - SinkyShared
      - Scribbly/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.amplify.watchkitapp.widgets
        INFOPLIST_FILE: ScribblyWatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: "AmplifyWatchWidgets CI"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
